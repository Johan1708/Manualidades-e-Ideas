<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manualidades Festivas - Galería</title>
    
    <!-- Fuentes Google Elegantes y Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Exo:wght@700&family=Raleway:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-color: #ffffff !important;        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.page-galeria {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        /* Botón de Inicio */
        .btn-home-nav {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 200;
            font-family: 'Exo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 22px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: background 0.3s, transform 0.3s, border-color 0.3s, color 0.3s;
            display: inline-block;
        }

        .btn-home-nav:hover {
            background: rgba(0, 255, 204, 0.25);
            border-color: #fafcfb;
            color: #d0dbd9 !important;
            transform: scale(1.05);
        }

        /* Títulos Superiores */
        .title {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .subtitulo-header {
            font-size: 14px;
            font-family: 'Exo', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .masking-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .masked-text {
            font-size: 54px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            color: transparent;
            background-image: url('https://images.unsplash.com/photo-1732535725600-f805d8b33c9c?q=80&w=1470&auto=format&fit=crop'); 
            background-size: 200%;
            background-position: 0 50%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: animate-background 5s infinite alternate linear;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
        }

        .masked-text.cambiando {
            opacity: 0;
            transform: translateY(-8px);
        }

        @keyframes animate-background {
            0% { background-position: 0 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Fondos Dinámicos */
        .contenedor-fondos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background-color: #050505;
        }

        .fondo-agua {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: url(#efecto-agua) brightness(0.9);
            opacity: 0;
            z-index: 1;
            transform: scale(1);
            transition: opacity 0.6s ease, filter 0.6s ease;
            will-change: opacity, filter;
        }

        .fondo-agua.capa-top { z-index: 3; }
        .fondo-agua.visible { opacity: 0.85; }
        .fondo-agua.saliendo { opacity: 0; z-index: 1; transition: opacity 0.9s ease; }

        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #three-container.activo { opacity: 1; }
        #three-container canvas { width: 100% !important; height: 100% !important; display: block; }

        /* Contenedor Principal */
        .contenedor-principal {
            position: relative;
            z-index: 20;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .galeria {
            position: relative;
            z-index: 100 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 260px;
            min-height: 80px;
        }

        .categoria-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .categoria-item.activo {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            z-index: 1000 !important;
        }

        .flecha-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 22px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: background 0.3s, border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .flecha-nav:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .flecha-nav.prev { left: 45px; }
        .flecha-nav.next { right: 45px; }

        /* ==========================================
           BOTÓN NEÓN GLOWING (ESTILO DEL VIDEO)
           ========================================== */
        .glowing-btn {
            position: relative !important;
            color: #ffffff !important;
            cursor: pointer !important;
            padding: 14px 32px !important; /* Espaciado interno cómodo */
            border: 2px solid #ffffff !important;
            border-radius: 10px !important;
            background: rgba(0, 0, 0, 0.4) !important; /* Fondo sutil para destacar sobre las imágenes */
            font-family: "Raleway", sans-serif !important;
            font-size: 1.15rem !important; /* Letra más grande y visible */
            font-weight: 900 !important;
            letter-spacing: 3px !important;
            text-decoration: none !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            white-space: nowrap !important;
            width: auto !important;
            min-width: unset !important; /* Elimina la caja fija gigante */
            max-width: none !important;
            backdrop-filter: blur(4px) !important;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.6), 0 0 15px rgba(255, 255, 255, 0.6) !important;
            animation: border-flicker 2s linear infinite !important;
        }

        .glowing-txt {
            float: none !important;
            margin-right: 0 !important;
            color: #ffffff !important;
            font-size: 1.15rem !important; /* Mantiene la misma escala */
            text-shadow: 0 0 6px #ffffff, 0 0 16px #ffffff !important;
            white-space: nowrap !important;
        }

        .faulty-letter {
            opacity: 0.5;
            animation: faulty-flicker 2s linear infinite;
        }

        .glowing-btn::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            opacity: 0.7;
            filter: blur(1em);
            transform: translateY(120%) rotateX(95deg) scale(1, 0.35);
            background: var(--glow-color);
            pointer-events: none;
        }

        .glowing-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;

            z-index: -1;
            background-color: var(--glow-color);
            box-shadow: 0 0 2em 0.2em var(--glow-color);
            transition: opacity 100ms linear;
        }

        .glowing-btn:hover {
            color: #000000 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 30px #ffffff !important;
        }

        .glowing-btn:hover .glowing-txt {
            color: #000000 !important;
            text-shadow: none !important;
        }

        .glowing-btn:hover .faulty-letter {
            animation: none;
            opacity: 1;
        }

        .glowing-btn:hover::after {
            opacity: 1;
        }

        @keyframes faulty-flicker {
            0% { opacity: 0.1; }
            2% { opacity: 1; }
            4% { opacity: 0.1; }
            19% { opacity: 1; }
            21% { opacity: 0.1; }
            23% { opacity: 1; }
            80% { opacity: 0.5; }
            83% { opacity: 0.4; }
            87% { opacity: 1; }
        }

        @keyframes text-flicker {
            0% { opacity: 0.1; }
            2% { opacity: 1; }
            8% { opacity: 0.1; }
            9% { opacity: 1; }
            12% { opacity: 0.1; }
            20% { opacity: 1; }
            25% { opacity: 0.3; }
            30% { opacity: 1; }
            70% { opacity: 0.7; }
            72% { opacity: 1; }
            77% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        @keyframes border-flicker {
            0% { opacity: 0.1; }
            2% { opacity: 1; }
            4% { opacity: 0.1; }
            8% { opacity: 1; }
            70% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* ==========================================
           CONTADOR REVERSIBLE RETRO (SIN RECUADROS/CAJAS)
           ========================================== */
        .countdown {
            position: fixed;
            bottom: 60px; /* Bajamos ligeramente la posición para compensar el tamaño */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 35px; /* Aumentamos la distancia entre números */
            z-index: 500;
            pointer-events: none;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            min-width: auto;
        }

        .countdown-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 5rem; /* Aumentado de 2.2rem a 3.5rem */
            font-weight: 700;
            color: #f7fbfa;
            text-shadow: 0 0 15px rgba(241, 248, 246, 0.9), 0 0 30px rgba(239, 241, 241, 0.5); /* Mayor resplandor */
            line-height: 1;
        }

        .countdown-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem; /* Aumentado de 0.75rem a 0.9rem */
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 6px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .footer h2 {
            font-size: 14px;
            font-family: 'Exo', sans-serif;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        /* ==========================================
           RESPONSIVE MÓVIL - GALERÍA
           ========================================== */

            body.page-galeria {
                cursor: auto !important;
            }

            .btn-home-nav {

            }

            .title {

            .glowing-btn {
                padding: 12px 20px !important;

            }

            .countdown {

            }

            .countdown-value {

            .countdown-label {

            }

            .footer {

            }

            .footer h2 {
                font-size: 11px !important;
            }
        }

    <!-- Script de Integración de Navegación + Contador Reversible Autocalculado -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const items = document.querySelectorAll(".categoria-item");
            const tituloEl = document.getElementById("categoria-actual");
            const capaA = document.querySelector(".contenedor-fondos .capa-a");
            const capaB = document.querySelector(".contenedor-fondos .capa-b");
            const btnPrev = document.querySelector(".flecha-nav.prev");
            const btnNext = document.querySelector(".flecha-nav.next");
            const sonidoHover = document.getElementById("sonido-hover");

            // Elementos del Contador
            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            let capaActivaA = true;
            let enTransicion = false;
            let timerInterval = null;

            const urlParams = new URLSearchParams(window.location.search);
            let catIndex = parseInt(urlParams.get("cat"));
            if (isNaN(catIndex) || catIndex < 0 || catIndex >= items.length) {
                catIndex = 0;
            }

            // Calcula automáticamente el próximo objetivo sin quedarse a 00
            function updateCountdown(targetMonth, targetDay) {
                if (timerInterval) clearInterval(timerInterval);

                function calc() {
                    const now = new Date();
                    let targetYear = now.getFullYear();
                    
                    // Fecha objetivo para este año
                    let targetDate = new Date(targetYear, targetMonth - 1, targetDay, 0, 0, 0);

                    // Si ya pasó en este año, apunta al año siguiente automáticamente
                    if (now.getTime() > targetDate.getTime()) {
                        targetDate = new Date(targetYear + 1, targetMonth - 1, targetDay, 0, 0, 0);
                    }

                    const difference = targetDate.getTime() - now.getTime();

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                    daysEl.textContent = days < 10 ? '0' + days : days;
                    hoursEl.textContent = hours < 10 ? '0' + hours : hours;
                    minutesEl.textContent = minutes < 10 ? '0' + minutes : minutes;
                    secondsEl.textContent = seconds < 10 ? '0' + seconds : seconds;
                }

                calc();
                timerInterval = setInterval(calc, 1000);
            }

            function cambiarCategoria(index) {
                if (enTransicion) return;
                enTransicion = true;

                if (tituloEl) tituloEl.classList.add("cambiando");

                setTimeout(() => {
                    items.forEach((item, i) => {
                        if (i === index) {
                            item.classList.add("activo");
                            const titulo = item.getAttribute("data-titulo");
                            const bg = item.getAttribute("data-bg");
                            const month = parseInt(item.getAttribute("data-month"));
                            const day = parseInt(item.getAttribute("data-day"));

                            if (tituloEl) tituloEl.textContent = titulo;
                            if (!isNaN(month) && !isNaN(day)) updateCountdown(month, day);

                            if (bg) {
                                if (capaActivaA) {
                                    if (capaB) capaB.style.backgroundImage = `url('${bg}')`;
                                    if (capaB) capaB.classList.add("visible");
                                    if (capaA) capaA.classList.remove("visible");
                                } else {
                                    if (capaA) capaA.style.backgroundImage = `url('${bg}')`;
                                    if (capaA) capaA.classList.add("visible");
                                    if (capaB) capaB.classList.remove("visible");
                                }
                                capaActivaA = !capaActivaA;
                            }
                        } else {
                            item.classList.remove("activo");
                        }
                    });

                    if (tituloEl) tituloEl.classList.remove("cambiando");

                    const newUrl = window.location.pathname + '?cat=' + index;
                    window.history.replaceState({ path: newUrl }, '', newUrl);

                    enTransicion = false;
                }, 220);
            }

            cambiarCategoria(catIndex);

            if (btnNext) {
                btnNext.addEventListener("click", function (e) {
                    e.preventDefault();
                    catIndex = (catIndex + 1) % items.length;
                    cambiarCategoria(catIndex);
                });
            }

            if (btnPrev) {
                btnPrev.addEventListener("click", function (e) {
                    e.preventDefault();
                    catIndex = (catIndex - 1 + items.length) % items.length;
                    cambiarCategoria(catIndex);
                });
            }

            document.addEventListener("keydown", function (e) {
                if (e.key === "ArrowRight") {
                    catIndex = (catIndex + 1) % items.length;
                    cambiarCategoria(catIndex);
                } else if (e.key === "ArrowLeft") {
                    catIndex = (catIndex - 1 + items.length) % items.length;
                    cambiarCategoria(catIndex);
                }
            });

            document.querySelectorAll(".glowing-btn, .flecha-nav, .btn-home-nav").forEach(element => {
                element.addEventListener("mouseenter", () => {
                    if (sonidoHover) {
                        sonidoHover.currentTime = 0;
                        sonidoHover.play().catch(() => {});
                    }
                });
            });
        });
        
    </script>
</body>
</html>
